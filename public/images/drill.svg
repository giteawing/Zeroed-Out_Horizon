    <path d="M342 336h88a26 26 0 0 1 0 52H342Z" fill="#6d7780" opacity="0.45" />
    <path d="M366 322v80M398 322v80M428 324v76" fill="none" stroke="#17110c" stroke-width="4" opacity="0.4" />
    <path d="M438 318v88" fill="none" stroke="#17110c" stroke-width="6" />
    <path d="M342 338h80a16 16 0 0 1 0 8H342Z" fill="#ffffff" opacity="0.35" />
  </g>

