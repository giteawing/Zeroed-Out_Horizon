      <circle cx="227.0" cy="394.0" r="4.6" fill="#3b4650" /><circle cx="221.4" cy="407.4" r="4.6" fill="#3b4650" /><circle cx="208.0" cy="413.0" r="4.6" fill="#3b4650" /><circle cx="194.6" cy="407.4" r="4.6" fill="#3b4650" /><circle cx="189.0" cy="394.0" r="4.6" fill="#3b4650" /><circle cx="194.6" cy="380.6" r="4.6" fill="#3b4650" /><circle cx="208.0" cy="375.0" r="4.6" fill="#3b4650" /><circle cx="221.4" cy="380.6" r="4.6" fill="#3b4650" />
