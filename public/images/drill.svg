    <path d="M0 352q128 14 256 4t256 -10" fill="none" stroke="#17110c" stroke-width="5" opacity="0.55" />
    <path d="M0 386q150 -12 256 -2t256 8" fill="none" stroke="#17110c" stroke-width="5" opacity="0.45" />
    <!-- нефтяной горизонт -->
    <path d="M0 396q128-22 256 -12t256 10v64q-128 20-256 14T0 460Z" fill="url(#oilGrad)" stroke="#17110c" stroke-width="6" />
    <circle cx="26" cy="424" r="5" fill="#0f0f13" opacity="0.8" /><circle cx="72" cy="438" r="8" fill="#0f0f13" opacity="0.8" /><circle cx="118" cy="452" r="11" fill="#0f0f13" opacity="0.8" /><circle cx="164" cy="424" r="5" fill="#0f0f13" opacity="0.8" /><circle cx="210" cy="438" r="8" fill="#0f0f13" opacity="0.8" /><circle cx="256" cy="452" r="11" fill="#0f0f13" opacity="0.8" /><circle cx="302" cy="424" r="5" fill="#0f0f13" opacity="0.8" /><circle cx="348" cy="438" r="8" fill="#0f0f13" opacity="0.8" /><circle cx="394" cy="452" r="11" fill="#0f0f13" opacity="0.8" /><circle cx="440" cy="424" r="5" fill="#0f0f13" opacity="0.8" /><circle cx="486" cy="438" r="8" fill="#0f0f13" opacity="0.8" />
    <path d="M0 300v212" stroke="#17110c" stroke-width="7" />
    <path d="M512 300v212" stroke="#17110c" stroke-width="7" />
  </g>

  <!-- ПОВЕРХНОСТЬ -->
