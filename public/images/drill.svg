    <linearGradient id="band2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a6a4a" />
      <stop offset="100%" stop-color="#5c4029" />
    </linearGradient>
  </defs>

  <!-- ПЛАСТ В РАЗРЕЗЕ: слои от поверхности до низа -->
