    <rect x="50" y="292" width="68" height="12" rx="4" fill="#2a2320" stroke="#17110c" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M84 132L84 96" stroke="#2a2320" stroke-width="5" stroke-linecap="round" fill="none" />
