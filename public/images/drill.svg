      <circle cx="304" cy="394" r="7" fill="#3b4650" />
    </g>
    <g>
      <circle cx="256" cy="424" r="28" fill="url(#steelGrad)" stroke="#17110c" stroke-width="7" />
      <circle cx="272.7" cy="427.4" r="4.6" fill="#3b4650" /><circle cx="261.4" cy="440.1" r="4.6" fill="#3b4650" /><circle cx="244.7" cy="436.7" r="4.6" fill="#3b4650" /><circle cx="239.3" cy="420.6" r="4.6" fill="#3b4650" /><circle cx="250.6" cy="407.9" r="4.6" fill="#3b4650" /><circle cx="267.3" cy="411.3" r="4.6" fill="#3b4650" />
      <circle cx="256" cy="424" r="6" fill="#3b4650" />
    </g>
  </g>

  <!-- БРЫЗГИ НЕФТИ (анимируются) -->
  <g id="splashes">
    <path d="M148 347.6c5.25 6.3 7.35 9.45 7.35 11.55a7.35 7.35 0 0 1 -14.7 0c0 -2.1 2.1 -5.25 7.35 -11.55Z" fill="url(#oil)" stroke="#17110c" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"  /><path d="M122 389.6c4 4.8 5.6 7.2 5.6 8.8a5.6 5.6 0 0 1 -11.2 0c0 -1.6 1.6 -4 5.6 -8.8Z" fill="url(#oil)" stroke="#17110c" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"  /><path d="M352 350.4c4.75 5.7 6.65 8.55 6.65 10.45a6.65 6.65 0 0 1 -13.3 0c0 -1.9 1.9 -4.75 6.65 -10.45Z" fill="url(#oil)" stroke="#17110c" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"  /><path d="M378 392.4c3.5 4.2 4.9 6.3 4.9 7.7a4.9 4.9 0 0 1 -9.8 0c0 -1.4 1.4 -3.5 4.9 -7.7Z" fill="url(#oil)" stroke="#17110c" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"  />
    <circle cx="168" cy="402" r="4.5" fill="url(#oilGrad)" stroke="#17110c" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round" /><circle cx="340" cy="406" r="4" fill="url(#oilGrad)" stroke="#17110c" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round" />
