    <rect x="178" y="322" width="156" height="22" rx="10" fill="url(#goldGrad)" stroke="#17110c" stroke-width="7" />
    <path d="M196 362h120" fill="none" stroke="#17110c" stroke-width="5" opacity="0.45" />
  </g>

