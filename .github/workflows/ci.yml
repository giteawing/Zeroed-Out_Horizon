name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

# Проверке достаточно читать код: токен без права записи.
permissions:
  contents: read

concurrency:
  # Одна проверка на ветку. Push и pull_request одной ветки этого репозитория
  # попадают в общую группу, поэтому открытый PR не удваивает прогон, а новый
  # push отменяет устаревший. У PR из форка группа своя: чужая ветка `main`
  # не может отменить проверку нашего `main`.
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Обычный прогон занимает 6–10 минут; зависший не должен жечь 6 часов.
    timeout-minutes: 30
    steps:
      # Actions закреплены по SHA коммита; версию в комментарии обновляет Dependabot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Типы и сборка
        run: npm run build
      - name: Проверка чистоты после сборки
        run: git diff --exit-code && test -z "$(git status --porcelain)"
      - name: Линтер
        run: npm run lint
      - name: Юнит- и DOM-тесты (включая тест баланса 12–25 минут)
        run: npm test -- --reporter=dot
      - name: Отчёт о балансе (в том числе при падении тестов)
        if: always()
        run: npm run balance:report
      - name: Playwright-браузер
        # Поддержка телефонов убрана: e2e гоняется только в настольном Chromium.
        run: npx playwright install --with-deps chromium
      - name: Дымовой e2e (desktop)
        run: npm run test:e2e
      - name: Сохранить отчёты при падении
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
