name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Типы и сборка
        run: npm run build
      - name: Проверка чистоты после сборки
        run: git diff --exit-code && test -z "$(git status --porcelain)"
      - name: Юнит- и DOM-тесты (включая тест баланса 12–25 минут)
        run: npm test -- --reporter=dot
      - name: Отчёт о балансе (в том числе при падении тестов)
        if: always()
        run: npm run balance:report
      - name: Playwright-браузер
        # Поддержка телефонов убрана: e2e гоняется только в настольном Chromium.
        run: npx playwright install --with-deps chromium
      - name: Дымовой e2e (desktop)
        run: npm run test:e2e
      - name: Сохранить отчёты при падении
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
